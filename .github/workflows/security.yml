name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1" # weekly: new advisories appear even when no code changes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install pip-audit==2.10.1
      # requirements.txt is fully pinned, so audit it as-is (no resolver, deterministic).
      # Ignored advisories are the ones we cannot fix yet because google-adk 2.1.0 caps
      # starlette<1 and opentelemetry-api<=1.41.1. Each was reviewed and none touches code this app
      # uses. Remove an ID once the pin can move.
      - name: pip-audit
        run: >
          pip-audit -r requirements.txt --no-deps --disable-pip
          --ignore-vuln CVE-2026-114603
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-2280
          --ignore-vuln PYSEC-2026-2281

  npm-audit:
    name: npm dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - run: npm ci
      # Blocking: anything that ships to browsers (production dependencies).
      - name: npm audit (production dependencies)
        run: npm audit --omit=dev --audit-level=high
      # Informational: build tooling (vite/esbuild) is not shipped; its advisories need the vite
      # 5 -> 8 major bump, tracked as a follow-up.
      - name: npm audit (all dependencies, informational)
        run: npm audit || true

  gitleaks:
    name: Secret scan (full git history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan every commit, not just the latest
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for organization-owned repos (gitleaks-action docs).
