line-length = 110
target-version = "py312"
extend-exclude = ["frontend"]

[lint]
# Correctness (E, F, B) and security (S, flake8-bandit) rules. Formatting/import-order rules are
# intentionally off so linting never rewrites files wholesale.
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = [
    # load_dotenv() must run before the modules that read the environment, so these imports are
    # deliberately not at the top of the file.
    "E402",
]

[lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake credentials are normal in tests
"eval/**" = ["S101"]
# False positive: an f-string building an LLM system prompt, not a SQL query.
"agent/specialists/setup_agent.py" = ["S608"]
